<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MentorFlow</title>
  <meta name="description" content="MentorFlow – offline-first tutoring and mentoring tracker: students, sessions, homework, invoicing.">
  <meta name="theme-color" content="#f6f8f8">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MentorFlow">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/app.css">
  <script>
    // Apply theme before first paint to avoid a flash.
    try { var d = matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.dataset.theme = d ? 'dark' : 'light'; } catch (e) {}
  </script>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <div id="app" class="app"><div class="boot">Loading MentorFlow…</div></div>
  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <noscript>MentorFlow needs JavaScript enabled.</noscript>
</body>
</html>
